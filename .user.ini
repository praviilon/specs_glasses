; Many shared hosts running PHP-FPM honor a .user.ini file to override PHP settings
; for just this folder, without needing access to the server's main php.ini.
; If your host ignores this file, raise the equivalent settings from your hosting
; control panel (look for "PHP Settings" / "MultiPHP INI Editor" or similar).

upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
